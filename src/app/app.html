<div class="app-container">
  <!-- Modular Header with Global Rating % & Actions -->
  <app-header (openEditor)="openEditor()" />

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Loading State -->
    @if (quiz.isLoading()) {
      <div class="state-card loading-state">
        <div class="spinner"></div>
        <p>Loading Scrum questions...</p>
      </div>
    }

    <!-- Error State -->
    @else if (quiz.errorMessage()) {
      <div class="state-card error-state">
        <div class="state-icon warning">⚠️</div>
        <h2>Unable to load questions</h2>
        <p>{{ quiz.errorMessage() }}</p>
        <button class="btn-primary" (click)="openEditor()">Open Markdown Editor</button>
      </div>
    }

    <!-- Active Question Card at the Top -->
    @else if (quiz.activeItem(); as active) {
      <div class="active-question-wrapper">
        <app-question-card 
          [item]="active" 
          [isActive]="true"
          (confirm)="onConfirm()"
          (next)="onNext()" />
      </div>

      <!-- History of Previous Questions Below -->
      @if (quiz.history().length > 0) {
        <app-history />
      }
    }
  </main>

  <!-- Markdown Editor Modal Component -->
  <app-markdown-modal 
    [isOpen]="isEditorOpen()" 
    (close)="closeEditor()" />
</div>
